controller_manager:
  ros__parameters:
    update_rate: 10

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    publish_rate: 50.0

    base_frame_id: base
    enable_odom_tf: true
    # Group all left wheels together in one list:
    left_wheel_names: ['front_left_wheel_joint', 'back_left_wheel_joint']
    #left_wheel_names: ['back_left_wheel_joint']
    # Group all right wheels together in one list:

    right_wheel_names: ['front_right_wheel_joint', 'back_right_wheel_joint']
    #right_wheel_names: ['back_right_wheel_joint']
    wheel_separation: 0.35
    wheel_radius: 0.05
    cmd_vel_timeout: 0.0

    # Rotational limits to prevent destabilization and SLAM drift
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 5.0
    angular.z.min_velocity: -0.5

    use_stamped_vel: false